parameters:
    app_mode_default: 'standalone'
    db_driver_default: 'mysql'
    webhook_url_default: ''
    email_from_default: 'noreply@webcalendar.local'
    email_from_name_default: 'WebCalendar'

services:
    _defaults:
        autowire: true
        autoconfigure: true

    App\:
        resource: '../src/'
        exclude:
            - '../src/DependencyInjection/'
            - '../src/Entity/'
            - '../src/Kernel.php'
            - '../src/Security/WebCalendarUser.php'

    # PBP-S5: PSR-20 Clock injection. Defaults to NativeClock; test env
    # (see config/services_test.yaml) overrides to MockClock.
    Psr\Clock\ClockInterface: '@Symfony\Component\Clock\NativeClock'
    Symfony\Component\Clock\NativeClock: ~

    App\Controller\:
        resource: '../src/Controller/'
        tags: ['controller.service_arguments']

    # PDO connection from DATABASE_URL
    pdo.connection:
        class: PDO
        factory: ['App\Service\PdoFactory', 'createFromUrl']
        arguments:
            - '%env(DATABASE_URL)%'

    # Tenant services
    # PBP-S11: TenantRateLimitStorage picks File or Redis backend based on REDIS_URL
    # env var. Consumers depend on the interface alone — no branching in app code.
    App\Tenant\TenantRateLimitStorage:
        factory: ['App\Tenant\TenantRateLimitStorageFactory', 'fromEnv']
        arguments:
            $redisUrl: '%env(default::REDIS_URL)%'
            $cacheDir: '%kernel.cache_dir%'

    App\Tenant\TenantRepository:
        arguments:
            $pdo: '@pdo.connection'

    App\Tenant\TenantResolverListener:
        arguments:
            $baseDomain: '%env(TENANT_BASE_DOMAIN)%'
            $appMode: '%env(APP_MODE)%'

    App\Tenant\ControlPlaneGuard:
        arguments:
            $appMode: '%env(default:app_mode_default:APP_MODE)%'

    App\Tenant\TenantDatabaseManager:
        arguments:
            $appSecret: '%env(APP_SECRET)%'

    # PBP-S12: doctrine/migrations wiring. We avoid the doctrine-bundle +
    # migrations-bundle combo because the app uses raw PDO — just the
    # migration CLI is enough. Commands get a pre-built DependencyFactory
    # so they never fall back to file-based config loaders.
    App\Migrations\MigrationDependencyFactoryProvider:
        arguments:
            $databaseUrl: '%env(DATABASE_URL)%'
            $projectDir: '%kernel.project_dir%'

    Doctrine\Migrations\DependencyFactory:
        factory: ['@App\Migrations\MigrationDependencyFactoryProvider', 'create']

    Doctrine\Migrations\Tools\Console\Command\MigrateCommand:
        arguments: ['@Doctrine\Migrations\DependencyFactory']
        tags: ['console.command']

    Doctrine\Migrations\Tools\Console\Command\StatusCommand:
        arguments: ['@Doctrine\Migrations\DependencyFactory']
        tags: ['console.command']

    Doctrine\Migrations\Tools\Console\Command\ListCommand:
        arguments: ['@Doctrine\Migrations\DependencyFactory']
        tags: ['console.command']

    Doctrine\Migrations\Tools\Console\Command\ExecuteCommand:
        arguments: ['@Doctrine\Migrations\DependencyFactory']
        tags: ['console.command']

    Doctrine\Migrations\Tools\Console\Command\SyncMetadataCommand:
        arguments: ['@Doctrine\Migrations\DependencyFactory']
        tags: ['console.command']

    Doctrine\Migrations\Tools\Console\Command\UpToDateCommand:
        arguments: ['@Doctrine\Migrations\DependencyFactory']
        tags: ['console.command']

    # Email services
    App\Service\ReminderService:
        arguments:
            $baseUrl: '%env(DEFAULT_URI)%'
            $appSecret: '%env(APP_SECRET)%'

    App\Service\DailyAgendaService:
        arguments:
            $baseUrl: '%env(DEFAULT_URI)%'
            $appSecret: '%env(APP_SECRET)%'

    App\Service\EventNotificationService:
        arguments:
            $fromAddress: '%env(default:email_from_default:MAIL_FROM_ADDRESS)%'
            $fromName: '%env(default:email_from_name_default:MAIL_FROM_NAME)%'
            $baseUrl: '%env(DEFAULT_URI)%'

    App\Service\EmailService:
        arguments:
            $fromAddress: '%env(default:email_from_default:MAIL_FROM_ADDRESS)%'
            $fromName: '%env(default:email_from_name_default:MAIL_FROM_NAME)%'

    # Webhook services
    App\Webhook\WebhookDispatcher:
        arguments:
            $pdo: '@pdo.connection'

    App\Webhook\WebhookRepository:
        arguments:
            $pdo: '@pdo.connection'

    # Auth provider repositories
    App\Auth\LdapConfigRepository:
        arguments:
            $pdo: '@pdo.connection'

    App\Auth\OAuthProviderRepository:
        arguments:
            $pdo: '@pdo.connection'

    # webcalendar-core service factory
    App\Service\CoreServiceFactory:
        public: true
        arguments:
            $pdo: '@pdo.connection'
            $appSecret: '%env(APP_SECRET)%'

    # Tenant-aware PDO provider (PBP-S4): lets controllers/services depend
    # on a narrow tenant-aware handle instead of the whole factory.
    App\Service\TenantAwarePdoProvider:
        arguments:
            $defaultPdo: '@pdo.connection'

    # Per-user JWT `jti` index (PBP-S6): complements Lexik's built-in
    # single-token blocklist for `logout-all` and admin force-logout.
    App\Security\UserTokenIndex:
        arguments:
            $pdo: '@pdo.connection'

    # PBP-S14: the four controllers below no longer take raw PDO — they
    # autowire their respective repositories, wired once here.
    App\View\SavedViewRepository:
        arguments:
            $pdo: '@pdo.connection'

    App\Push\PushSubscriptionRepository:
        arguments:
            $pdo: '@pdo.connection'

    App\Poll\PollRepository:
        arguments:
            $pdo: '@pdo.connection'

    App\Subscription\SubscriptionRepository:
        arguments:
            $pdo: '@pdo.connection'

    App\CustomField\CustomFieldRepository:
        arguments:
            $pdo: '@pdo.connection'

    # Subscription refresh command still uses PDO directly (admin refresh job)
    App\Command\RefreshSubscriptionsCommand:
        arguments:
            $pdo: '@pdo.connection'

    # PBP-S14: ShareController used to hand-build ShareTokenRepository;
    # now depends on the repo directly, wired once here.
    App\Share\ShareTokenRepository:
        arguments:
            $pdo: '@pdo.connection'

    # Monolog processor for request correlation IDs
    App\Monolog\RequestIdProcessor:
        tags:
            - { name: monolog.processor }

    # Error metrics
    App\Service\ErrorMetricsService:
        arguments:
            $pdo: '@pdo.connection'

    # Geo services
    App\Service\GeoRepository:
        arguments:
            $pdo: '@pdo.connection'

    # PBP-S14: previously hand-constructed inside EventController — now
    # autowired via explicit $pdo binding so the controller's dep graph is
    # visible on the constructor.
    App\Service\ExtParticipantRepository:
        arguments:
            $pdo: '@pdo.connection'

    # Unsubscribe controller needs APP_SECRET for token verification
    App\Controller\Api\UnsubscribeController:
        arguments:
            $appSecret: '%env(APP_SECRET)%'

    # Backup service
    App\Service\BackupService:
        arguments:
            $pdo: '@pdo.connection'
            $databaseUrl: '%env(DATABASE_URL)%'
            $projectDir: '%kernel.project_dir%'

    # Security audit controller
    App\Controller\Api\SecurityAuditController:
        arguments:
            $pdo: '@pdo.connection'
            $appSecret: '%env(APP_SECRET)%'
            $environment: '%kernel.environment%'

    # Comment controller needs PDO
    App\Controller\Api\CommentController:
        arguments:
            $pdo: '@pdo.connection'

    # Dashboard controller needs PDO for stats queries
    App\Controller\Api\DashboardController:
        arguments:
            $pdo: '@pdo.connection'

    # Access controller needs direct PDO for user-to-user permissions
    App\Controller\Api\AccessController:
        arguments:
            $pdo: '@pdo.connection'

    # Layer controller needs direct PDO for ID workaround
    App\Controller\Api\LayerController:
        arguments:
            $pdo: '@pdo.connection'

    # OAuth controller needs JWT TTL
    App\Controller\Api\OAuthController:
        arguments:
            $jwtTtl: '%env(int:JWT_TTL)%'

    # Auth controller needs JWT TTL
    App\Controller\Api\AuthController:
        arguments:
            $jwtTtl: '%env(int:JWT_TTL)%'

    # PBP-S13: liveness/readiness split. ReadinessProbe owns the DB ping;
    # HealthController no longer takes the shared PDO.
    App\Service\ReadinessProbe:
        arguments:
            $databaseUrl: '%env(DATABASE_URL)%'

    App\Controller\Api\HealthController:
        arguments:
            $appMode: '%env(default:app_mode_default:APP_MODE)%'

    # User provider for Symfony Security
    App\Security\WebCalendarUserProvider:
        public: true

    App\Tenant\ControlPlaneWebhook:
        arguments:
            $webhookUrl: '%env(default:webhook_url_default:CONTROL_WEBHOOK_URL)%'

    App\Tenant\TenantProvisioner:
        arguments:
            $dbDriver: '%env(default:db_driver_default:TENANT_DB_DRIVER)%'

    App\Tenant\TenantMigrator:
        arguments:
            $migrationsDir: '%kernel.project_dir%/migrations/tenant'

    # Control plane
    App\Controller\Control\TenantController:
        tags: ['controller.service_arguments']

    App\Controller\Control\ControlAuthController:
        arguments:
            $pdo: '@pdo.connection'
            $jwtTtl: '%env(int:JWT_TTL)%'
        tags: ['controller.service_arguments']

    # Tenant CLI commands
    App\Command\TenantCreateCommand:
        arguments:
            $baseDomain: '%env(TENANT_BASE_DOMAIN)%'

    # Install command needs DATABASE_URL for schema detection
    App\Command\InstallCommand:
        arguments:
            $databaseUrl: '%env(DATABASE_URL)%'

    # Dev reset command needs raw PDO + kernel environment for guards
    App\Command\ResetEventsCommand:
        arguments:
            $pdo: '@pdo.connection'
            $appEnv: '%kernel.environment%'

    # webcalendar-core services and repositories — bridge the factory so the
    # Symfony container can inject each service by its concrete type. This is
    # the PBP-S4 migration away from the CoreServiceFactory service-locator
    # anti-pattern: controllers can now depend on the specific services they
    # actually use rather than the whole factory.
    WebCalendar\Core\Application\Service\EventService:
        factory: ['@App\Service\CoreServiceFactory', 'getEventService']
    WebCalendar\Core\Application\Service\UserService:
        factory: ['@App\Service\CoreServiceFactory', 'getUserService']
    WebCalendar\Core\Application\Service\CategoryService:
        factory: ['@App\Service\CoreServiceFactory', 'getCategoryService']
    WebCalendar\Core\Application\Service\SecurityService:
        factory: ['@App\Service\CoreServiceFactory', 'getSecurityService']
    WebCalendar\Core\Application\Service\GroupService:
        factory: ['@App\Service\CoreServiceFactory', 'getGroupService']
    WebCalendar\Core\Application\Service\LayerService:
        factory: ['@App\Service\CoreServiceFactory', 'getLayerService']
    WebCalendar\Core\Application\Service\PermissionService:
        factory: ['@App\Service\CoreServiceFactory', 'getPermissionService']
    WebCalendar\Core\Application\Service\ConfigService:
        factory: ['@App\Service\CoreServiceFactory', 'getConfigService']
    WebCalendar\Core\Application\Service\ActivityLogService:
        factory: ['@App\Service\CoreServiceFactory', 'getActivityLogService']
    WebCalendar\Core\Application\Service\BlobService:
        factory: ['@App\Service\CoreServiceFactory', 'getBlobService']
    WebCalendar\Core\Application\Service\ResourceService:
        factory: ['@App\Service\CoreServiceFactory', 'getResourceService']
    WebCalendar\Core\Application\Service\TemplateService:
        factory: ['@App\Service\CoreServiceFactory', 'getTemplateService']
    WebCalendar\Core\Application\Service\ViewService:
        factory: ['@App\Service\CoreServiceFactory', 'getViewService']
    WebCalendar\Core\Application\Service\TaskService:
        factory: ['@App\Service\CoreServiceFactory', 'getTaskService']
    WebCalendar\Core\Application\Service\JournalService:
        factory: ['@App\Service\CoreServiceFactory', 'getJournalService']
    WebCalendar\Core\Application\Service\SiteExtraService:
        factory: ['@App\Service\CoreServiceFactory', 'getSiteExtraService']
    WebCalendar\Core\Application\Service\ReportService:
        factory: ['@App\Service\CoreServiceFactory', 'getReportService']
    WebCalendar\Core\Application\Service\SearchService:
        factory: ['@App\Service\CoreServiceFactory', 'getSearchService']
    WebCalendar\Core\Application\Service\RecurrenceService:
        factory: ['@App\Service\CoreServiceFactory', 'getRecurrenceService']
    WebCalendar\Core\Application\Service\AssistantService:
        factory: ['@App\Service\CoreServiceFactory', 'getAssistantService']
    WebCalendar\Core\Application\Service\ImportService:
        factory: ['@App\Service\CoreServiceFactory', 'getImportService']
    WebCalendar\Core\Application\Service\ExportService:
        factory: ['@App\Service\CoreServiceFactory', 'getExportService']
    WebCalendar\Core\Application\Service\BookingService:
        factory: ['@App\Service\CoreServiceFactory', 'getBookingService']
    WebCalendar\Core\Application\Service\NotificationService:
        factory: ['@App\Service\CoreServiceFactory', 'getNotificationService']
    WebCalendar\Core\Application\Contract\AuthServiceInterface:
        factory: ['@App\Service\CoreServiceFactory', 'getAuthService']
    WebCalendar\Core\Application\Contract\RateLimiterInterface:
        factory: ['@App\Service\CoreServiceFactory', 'getRateLimiter']
    WebCalendar\Core\Application\Service\FeedService:
        factory: ['@App\Service\CoreServiceFactory', 'getFeedService']
        arguments: ['']

    # webcalendar-core PDO repositories — bridge for controllers/services
    # that need direct repository access (e.g. custom queries or
    # non-service-level operations).
    WebCalendar\Core\Infrastructure\Persistence\PdoEventRepository:
        factory: ['@App\Service\CoreServiceFactory', 'getEventRepository']
    WebCalendar\Core\Infrastructure\Persistence\PdoUserRepository:
        factory: ['@App\Service\CoreServiceFactory', 'getUserRepository']
    WebCalendar\Core\Infrastructure\Persistence\PdoCategoryRepository:
        factory: ['@App\Service\CoreServiceFactory', 'getCategoryRepository']
    WebCalendar\Core\Infrastructure\Persistence\PdoTokenRepository:
        factory: ['@App\Service\CoreServiceFactory', 'getTokenRepository']
    WebCalendar\Core\Infrastructure\Persistence\PdoActivityLogRepository:
        factory: ['@App\Service\CoreServiceFactory', 'getActivityLogRepository']
    WebCalendar\Core\Infrastructure\Persistence\PdoGroupRepository:
        factory: ['@App\Service\CoreServiceFactory', 'getGroupRepository']
    WebCalendar\Core\Infrastructure\Persistence\PdoLayerRepository:
        factory: ['@App\Service\CoreServiceFactory', 'getLayerRepository']
    WebCalendar\Core\Infrastructure\Persistence\PdoPermissionRepository:
        factory: ['@App\Service\CoreServiceFactory', 'getPermissionRepository']
    WebCalendar\Core\Infrastructure\Persistence\PdoConfigRepository:
        factory: ['@App\Service\CoreServiceFactory', 'getConfigRepository']
    WebCalendar\Core\Infrastructure\Persistence\PdoBlobRepository:
        factory: ['@App\Service\CoreServiceFactory', 'getBlobRepository']
    WebCalendar\Core\Infrastructure\Persistence\PdoResourceRepository:
        factory: ['@App\Service\CoreServiceFactory', 'getResourceRepository']
    WebCalendar\Core\Infrastructure\Persistence\PdoTemplateRepository:
        factory: ['@App\Service\CoreServiceFactory', 'getTemplateRepository']
    WebCalendar\Core\Infrastructure\Persistence\PdoViewRepository:
        factory: ['@App\Service\CoreServiceFactory', 'getViewRepository']
    WebCalendar\Core\Infrastructure\Persistence\PdoTaskRepository:
        factory: ['@App\Service\CoreServiceFactory', 'getTaskRepository']
    WebCalendar\Core\Infrastructure\Persistence\PdoJournalRepository:
        factory: ['@App\Service\CoreServiceFactory', 'getJournalRepository']
    WebCalendar\Core\Infrastructure\Persistence\PdoSiteExtraRepository:
        factory: ['@App\Service\CoreServiceFactory', 'getSiteExtraRepository']
    WebCalendar\Core\Infrastructure\Persistence\PdoReportRepository:
        factory: ['@App\Service\CoreServiceFactory', 'getReportRepository']
    WebCalendar\Core\Infrastructure\Persistence\PdoAssistantRepository:
        factory: ['@App\Service\CoreServiceFactory', 'getAssistantRepository']
    WebCalendar\Core\Infrastructure\Persistence\PdoReminderRepository:
        factory: ['@App\Service\CoreServiceFactory', 'getReminderRepository']

    # Bind each repository interface to its concrete impl so controllers can
    # depend on the interface (proper DIP) rather than the PDO implementation.
    WebCalendar\Core\Domain\Repository\EventRepositoryInterface: '@WebCalendar\Core\Infrastructure\Persistence\PdoEventRepository'
    WebCalendar\Core\Domain\Repository\UserRepositoryInterface: '@WebCalendar\Core\Infrastructure\Persistence\PdoUserRepository'
    WebCalendar\Core\Domain\Repository\CategoryRepositoryInterface: '@WebCalendar\Core\Infrastructure\Persistence\PdoCategoryRepository'
    WebCalendar\Core\Domain\Repository\TokenRepositoryInterface: '@WebCalendar\Core\Infrastructure\Persistence\PdoTokenRepository'
    WebCalendar\Core\Domain\Repository\ActivityLogRepositoryInterface: '@WebCalendar\Core\Infrastructure\Persistence\PdoActivityLogRepository'
    WebCalendar\Core\Domain\Repository\GroupRepositoryInterface: '@WebCalendar\Core\Infrastructure\Persistence\PdoGroupRepository'
    WebCalendar\Core\Domain\Repository\LayerRepositoryInterface: '@WebCalendar\Core\Infrastructure\Persistence\PdoLayerRepository'
    WebCalendar\Core\Domain\Repository\PermissionRepositoryInterface: '@WebCalendar\Core\Infrastructure\Persistence\PdoPermissionRepository'
    WebCalendar\Core\Domain\Repository\ConfigRepositoryInterface: '@WebCalendar\Core\Infrastructure\Persistence\PdoConfigRepository'
    WebCalendar\Core\Domain\Repository\BlobRepositoryInterface: '@WebCalendar\Core\Infrastructure\Persistence\PdoBlobRepository'
    WebCalendar\Core\Domain\Repository\ResourceRepositoryInterface: '@WebCalendar\Core\Infrastructure\Persistence\PdoResourceRepository'
    WebCalendar\Core\Domain\Repository\TemplateRepositoryInterface: '@WebCalendar\Core\Infrastructure\Persistence\PdoTemplateRepository'
    WebCalendar\Core\Domain\Repository\ViewRepositoryInterface: '@WebCalendar\Core\Infrastructure\Persistence\PdoViewRepository'
    WebCalendar\Core\Domain\Repository\TaskRepositoryInterface: '@WebCalendar\Core\Infrastructure\Persistence\PdoTaskRepository'
    WebCalendar\Core\Domain\Repository\JournalRepositoryInterface: '@WebCalendar\Core\Infrastructure\Persistence\PdoJournalRepository'
    WebCalendar\Core\Domain\Repository\SiteExtraRepositoryInterface: '@WebCalendar\Core\Infrastructure\Persistence\PdoSiteExtraRepository'
    WebCalendar\Core\Domain\Repository\ReportRepositoryInterface: '@WebCalendar\Core\Infrastructure\Persistence\PdoReportRepository'
    WebCalendar\Core\Domain\Repository\AssistantRepositoryInterface: '@WebCalendar\Core\Infrastructure\Persistence\PdoAssistantRepository'
    WebCalendar\Core\Domain\Repository\ReminderRepositoryInterface: '@WebCalendar\Core\Infrastructure\Persistence\PdoReminderRepository'

    # Purge service needs raw PDO + activity log + webhook dispatcher
    App\Service\PurgeService:
        arguments:
            $pdo: '@pdo.connection'
            $activityLog: '@WebCalendar\Core\Infrastructure\Persistence\PdoActivityLogRepository'
            $webhookDispatcher: '@App\Webhook\WebhookDispatcher'
            $calendarPublisher: '@App\Service\MercurePublisher'
            $syncTokens: '@App\Service\CalDavSyncTokenRepository'

    App\Service\CalDavSyncTokenRepository:
        arguments:
            $pdo: '@pdo.connection'

    App\Service\CategoryIconRepository:
        arguments:
            $pdo: '@pdo.connection'

    # Exception subscriber needs kernel environment
    App\EventSubscriber\ExceptionSubscriber:
        arguments:
            $environment: '%kernel.environment%'
