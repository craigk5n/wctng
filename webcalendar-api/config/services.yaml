parameters:
    app_mode_default: 'standalone'
    db_driver_default: 'mysql'
    webhook_url_default: ''

services:
    _defaults:
        autowire: true
        autoconfigure: true

    App\:
        resource: '../src/'
        exclude:
            - '../src/DependencyInjection/'
            - '../src/Entity/'
            - '../src/Kernel.php'
            - '../src/Security/WebCalendarUser.php'

    App\Controller\:
        resource: '../src/Controller/'
        tags: ['controller.service_arguments']

    # PDO connection from DATABASE_URL
    pdo.connection:
        class: PDO
        factory: ['App\Service\PdoFactory', 'createFromUrl']
        arguments:
            - '%env(DATABASE_URL)%'

    # Tenant services
    App\Tenant\TenantRateLimiter:
        arguments:
            $storageDir: '%kernel.cache_dir%'

    App\Tenant\TenantRepository:
        arguments:
            $pdo: '@pdo.connection'

    App\Tenant\TenantResolverListener:
        arguments:
            $baseDomain: '%env(TENANT_BASE_DOMAIN)%'
            $appMode: '%env(APP_MODE)%'

    App\Tenant\ControlPlaneGuard:
        arguments:
            $appMode: '%env(default:app_mode_default:APP_MODE)%'

    App\Tenant\TenantDatabaseManager:
        arguments:
            $appSecret: '%env(APP_SECRET)%'

    # OAuth provider repository
    App\Auth\OAuthProviderRepository:
        arguments:
            $pdo: '@pdo.connection'

    # webcalendar-core service factory
    App\Service\CoreServiceFactory:
        public: true
        arguments:
            $pdo: '@pdo.connection'
            $appSecret: '%env(APP_SECRET)%'

    # Event controller needs PDO for access permission checks
    App\Controller\Api\EventController:
        arguments:
            $pdo: '@pdo.connection'

    # Access controller needs direct PDO for user-to-user permissions
    App\Controller\Api\AccessController:
        arguments:
            $pdo: '@pdo.connection'

    # Layer controller needs direct PDO for ID workaround
    App\Controller\Api\LayerController:
        arguments:
            $pdo: '@pdo.connection'

    # OAuth controller needs JWT TTL
    App\Controller\Api\OAuthController:
        arguments:
            $jwtTtl: '%env(int:JWT_TTL)%'

    # Auth controller needs JWT TTL
    App\Controller\Api\AuthController:
        arguments:
            $jwtTtl: '%env(int:JWT_TTL)%'

    # Health controller needs APP_MODE
    App\Controller\Api\HealthController:
        arguments:
            $appMode: '%env(default:app_mode_default:APP_MODE)%'

    # User provider for Symfony Security
    App\Security\WebCalendarUserProvider:
        public: true

    App\Tenant\ControlPlaneWebhook:
        arguments:
            $webhookUrl: '%env(default:webhook_url_default:CONTROL_WEBHOOK_URL)%'

    App\Tenant\TenantProvisioner:
        arguments:
            $dbDriver: '%env(default:db_driver_default:TENANT_DB_DRIVER)%'

    App\Tenant\TenantMigrator:
        arguments:
            $migrationsDir: '%kernel.project_dir%/migrations/tenant'

    # Control plane
    App\Controller\Control\TenantController:
        tags: ['controller.service_arguments']

    App\Controller\Control\ControlAuthController:
        arguments:
            $pdo: '@pdo.connection'
            $jwtTtl: '%env(int:JWT_TTL)%'
        tags: ['controller.service_arguments']

    # Tenant CLI commands
    App\Command\TenantCreateCommand:
        arguments:
            $baseDomain: '%env(TENANT_BASE_DOMAIN)%'

    # Install command needs DATABASE_URL for schema detection
    App\Command\InstallCommand:
        arguments:
            $databaseUrl: '%env(DATABASE_URL)%'

    # Exception subscriber needs kernel environment
    App\EventSubscriber\ExceptionSubscriber:
        arguments:
            $environment: '%kernel.environment%'
