security:
    password_hashers:
        App\Security\WebCalendarUser: auto

    providers:
        webcalendar_provider:
            id: App\Security\WebCalendarUserProvider

    firewalls:
        dev:
            pattern: ^/(_(profiler|wdt)|css|images|js)/
            security: false

        # Public endpoints — no authentication required
        auth:
            pattern: ^/api/v2/auth/login$
            stateless: true
            security: false

        health:
            pattern: ^/api/v2/health$
            stateless: true
            security: false

        setup:
            pattern: ^/api/v2/setup/
            stateless: true
            security: false

        oauth:
            pattern: ^/api/v2/auth/oauth/
            stateless: true
            security: false

        # CalDAV — auth handled by sabre/dav internally
        caldav:
            pattern: ^/dav/
            stateless: true
            security: false

        # Control plane — handled by ControlPlaneGuard listener
        control:
            pattern: ^/control/
            stateless: true
            security: false

        # Public calendar endpoints — no authentication required
        public_calendar:
            pattern: ^/api/v2/public/
            stateless: true
            security: false

        # SSR public pages (SEO) — no authentication required
        seo_pages:
            pattern: ^/public/
            stateless: true
            security: false

        i18n:
            pattern: ^/api/v2/i18n/
            stateless: true
            security: false

        # MCP endpoint uses its own API token auth
        mcp:
            pattern: ^/api/v2/mcp$
            stateless: true
            security: false

        config_features:
            pattern: ^/api/v2/config/features$
            stateless: true
            security: false

        config_custom_html:
            pattern: ^/api/v2/config/custom-html$
            stateless: true
            security: false

        unsubscribe:
            pattern: ^/api/v2/unsubscribe/
            stateless: true
            security: false

        # Protected API endpoints — require JWT
        api:
            pattern: ^/api/
            stateless: true
            provider: webcalendar_provider
            jwt: ~

    access_control:
        - { path: ^/public/, roles: PUBLIC_ACCESS }
        - { path: ^/sitemap\.xml$, roles: PUBLIC_ACCESS }
        - { path: ^/robots\.txt$, roles: PUBLIC_ACCESS }
        - { path: ^/api/v2/auth/login$, roles: PUBLIC_ACCESS }
        - { path: ^/api/v2/health$, roles: PUBLIC_ACCESS }
        - { path: ^/api/v2/setup/, roles: PUBLIC_ACCESS }
        - { path: ^/api/v2/public/, roles: PUBLIC_ACCESS }
        - { path: ^/api/v2/i18n/, roles: PUBLIC_ACCESS }
        - { path: ^/api/v2/custom-fields$, roles: PUBLIC_ACCESS }
        - { path: ^/api/v2/config/features$, roles: PUBLIC_ACCESS }
        - { path: ^/api/v2/config/custom-html$, roles: PUBLIC_ACCESS }
        - { path: ^/api/v2/unsubscribe/, roles: PUBLIC_ACCESS }
        - { path: ^/api/v2/mcp$, roles: PUBLIC_ACCESS }
        - { path: ^/api/, roles: IS_AUTHENTICATED_FULLY }
