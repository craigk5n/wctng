name: OpenAPI CI

on:
  push:
    branches: [main]
    paths:
      - "webcalendar-openapi/**"
      - ".github/workflows/openapi.yml"
  pull_request:
    branches: [main]
    paths:
      - "webcalendar-openapi/**"
      - ".github/workflows/openapi.yml"

defaults:
  run:
    working-directory: webcalendar-openapi

jobs:
  ci:
    name: OpenAPI Lint & Generate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: webcalendar-openapi/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint OpenAPI spec
        run: make lint

      - name: Generate TypeScript types
        run: make generate

      - name: Verify generated types exist
        run: test -f generated/typescript/index.ts
