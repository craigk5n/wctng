name: API CI

on:
  push:
    branches: [main]
    paths:
      - "webcalendar-api/**"
      - ".github/workflows/api.yml"
  pull_request:
    branches: [main]
    paths:
      - "webcalendar-api/**"
      - ".github/workflows/api.yml"

defaults:
  run:
    working-directory: webcalendar-api

jobs:
  mutation:
    name: Mutation testing (changed lines)
    runs-on: ubuntu-latest
    # Blocking, with a deliberately loose floor.
    #
    # Measured on real commits (diff-scoped, so 16-35 mutants each): 77-81%
    # covered MSI. The floor is 60 because a diff this small makes every
    # mutant worth 3-6 points, and equivalent mutants are common here -- one
    # file audited this week finished with 20 survivors, all of them provably
    # unkillable. A gate that fails on those gets switched off, so it is set
    # to catch "this was not tested at all" rather than to police the last
    # few points. Raise it as the tree improves.
    #
    # A PR that changes no source file exits 0 on its own ("Could not find any
    # modified files"), so docs and test-only changes cannot be blocked;
    # --ignore-msi-with-no-mutations covers the narrower case where source did
    # change but the changed lines yield no mutants.
    #
    # Known limitation: --git-diff-lines mutates only lines the *Unit* suite
    # covers (see testFrameworkOptions in infection.json5), so changed lines
    # with no unit test generate no mutants and pass. --with-uncovered does
    # not fix this: on the same diff it reported 108 of 124 mutants as
    # uncovered, because controllers are exercised by the Functional suite
    # that Infection does not run. Line coverage is the right tool for that
    # question; this job answers "are the tests that exist any good".

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Needs history to diff against: fetch-depth 1 has no base to compare.
          fetch-depth: 0

      - name: Setup PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: intl, pdo_mysql, zip, mbstring, sodium, curl
          coverage: pcov
          tools: composer:v2

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Generate JWT keys
        run: |
          mkdir -p config/jwt
          openssl genrsa -out config/jwt/private.pem -passout pass:ci_passphrase 4096
          openssl rsa -in config/jwt/private.pem -passin pass:ci_passphrase -pubout -out config/jwt/public.pem

      # On a pull request the base is the target branch; on a push to main
      # there is no branch to compare against, so use the previous commit.
      - name: Resolve diff base
        id: base
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "ref=origin/${{ github.base_ref }}" >> $GITHUB_OUTPUT
          else
            echo "ref=${{ github.event.before }}" >> $GITHUB_OUTPUT
          fi

      - name: Run Infection on changed lines
        env:
          APP_ENV: test
          APP_SECRET: ci_secret
          JWT_SECRET_KEY: "%kernel.project_dir%/config/jwt/private.pem"
          JWT_PUBLIC_KEY: "%kernel.project_dir%/config/jwt/public.pem"
          JWT_PASSPHRASE: ci_passphrase
        run: |
          bin/install-infection.sh
          php var/tools/infection.phar \
            --threads=max \
            --git-diff-lines \
            --git-diff-base="${{ steps.base.outputs.ref }}" \
            --min-covered-msi=60 \
            --ignore-msi-with-no-mutations \
            --logger-github \
            --no-interaction

  ci:
    name: PHP CI (PHPStan, Psalm, PHPUnit, CS)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # PBP-S7: run on 8.3 (baseline) and 8.4 (allowed-to-fail forward check).
        php-version: ["8.3", "8.4"]
    continue-on-error: ${{ matrix.php-version == '8.4' }}

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: webcalendar_test
          MYSQL_USER: webcalendar
          MYSQL_PASSWORD: webcalendar_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Needed by the changed-lines coverage gate below, which diffs
          # against the base; fetch-depth 1 has no base to compare.
          fetch-depth: 0

      - name: Setup PHP ${{ matrix.php-version }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: intl, pdo_mysql, zip, mbstring, sodium, curl
          coverage: xdebug
          tools: composer:v2

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('webcalendar-api/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      # Must follow composer install: the schema ships inside the
      # webcalendar-core package, and there is no sibling checkout of it.
      - name: Load webcalendar-core schema
        run: mysql -h 127.0.0.1 -u webcalendar -pwebcalendar_test webcalendar_test < vendor/craigk5n/webcalendar-core/src/Infrastructure/Persistence/mysql-schema.sql

      - name: Apply API migrations
        run: php bin/console migrations:migrate --no-interaction
        env:
          DATABASE_URL: "mysql://webcalendar:webcalendar_test@127.0.0.1:3306/webcalendar_test"

      # The functional suite authenticates as admin/admin on nearly every
      # request; the schema seeds no users, so without this every one 401s.
      - name: Seed admin fixture user
        run: php bin/console webcalendar:install --force --admin-password=admin
        env:
          DATABASE_URL: "mysql://webcalendar:webcalendar_test@127.0.0.1:3306/webcalendar_test"

      - name: Security audit (PBP-S8) — fail on any advisory
        run: composer audit --no-interaction

      - name: Generate JWT keys
        run: |
          mkdir -p config/jwt
          openssl genrsa -out config/jwt/private.pem -passout pass:ci_passphrase 4096
          openssl rsa -in config/jwt/private.pem -passin pass:ci_passphrase -pubout -out config/jwt/public.pem

      - name: Check code style
        run: make cs-check

      - name: Check #[\SensitiveParameter] on secret parameters (PBP-S1)
        run: composer check-sensitive-params

      - name: Check ClockInterface injection (PBP-S5)
        run: composer check-clock-injection

      - name: Check webcalendar-core schema drift
        run: composer check-schema-drift

      - name: Run PHPStan (level 9)
        run: make phpstan

      - name: Run Psalm
        run: make psalm

      - name: Run PHPUnit
        env:
          APP_ENV: test
          APP_SECRET: ci_secret
          DATABASE_URL: "mysql://webcalendar:webcalendar_test@127.0.0.1:3306/webcalendar_test"
          # Lets TenantProvisioningOnMySqlTest actually provision rather than
          # skip: it needs a login that may CREATE DATABASE and CREATE USER,
          # which the application login above deliberately does not have.
          TENANT_ADMIN_DATABASE_URL: "mysql://root:root@127.0.0.1:3306/webcalendar_test"
          JWT_SECRET_KEY: "%kernel.project_dir%/config/jwt/private.pem"
          JWT_PUBLIC_KEY: "%kernel.project_dir%/config/jwt/public.pem"
          JWT_PASSPHRASE: ci_passphrase
          JWT_TTL: 3600
          # CORS_ALLOW_ORIGIN deliberately not set: .env.test defines it as
          # http://localhost:47173 and CorsTest asserts that exact origin is
          # echoed back. Overriding it here made the origin disallowed, so no
          # header came back and the test failed. Unlike DATABASE_URL and the
          # JWT paths, this has no CI-specific reason to differ.
        run: make coverage

      # Same base as the mutation job: the target branch on a PR, the previous
      # commit on a push to main.
      - name: Resolve diff base
        id: covbase
        if: matrix.php-version == '8.3'
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "ref=origin/${{ github.base_ref }}" >> $GITHUB_OUTPUT
          else
            echo "ref=${{ github.event.before }}" >> $GITHUB_OUTPUT
          fi

      # Pairs with the mutation job: that one asks whether the tests that
      # exist are any good, this one asks whether they exist at all. Both are
      # scoped to changed lines, because a global floor on a codebase at 64%
      # line coverage either sits uselessly below it or fails every PR.
      #
      # The floor is 60%. Measured on this branch's own commits, changed-line
      # coverage ran 53-76%; the 53% was the clock injection, which touched
      # three ReportController endpoints that have no test of any kind. So
      # this will bite on work that touches untested controllers, which is
      # the point. Raise it as coverage improves.
      - name: Check coverage of changed lines
        if: matrix.php-version == '8.3'
        run: php bin/check-coverage.php var/coverage/clover.xml "${{ steps.covbase.outputs.ref }}" 60

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-coverage
          path: webcalendar-api/var/coverage/
          retention-days: 7
