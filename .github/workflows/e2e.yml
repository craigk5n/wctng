name: E2E Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  e2e:
    name: Playwright E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: intl, pdo_mysql, zip, mbstring
          tools: composer:v2

      # Must precede `compose up`. The stack bind-mounts ./webcalendar-api, and
      # vendor/ is gitignored, so without this php-fpm boots with no autoloader
      # and nginx never passes its healthcheck. MySQL is affected too: its init
      # script is mounted from vendor/craigk5n/webcalendar-core, and Docker
      # silently creates a directory in place of a missing bind-mount source,
      # which the entrypoint skips — leaving the database empty.
      - name: Install PHP dependencies
        working-directory: webcalendar-api
        run: composer install --no-interaction --prefer-dist

      # var/ is gitignored, so a fresh checkout has none. The container runs as
      # www-data (uid 82) while the bind-mounted checkout belongs to the runner,
      # so Symfony cannot create it and every request 500s with "Unable to
      # create the cache directory" — which surfaces as nginx being unhealthy.
      - name: Create writable var/ for the container
        run: |
          mkdir -p webcalendar-api/var/cache webcalendar-api/var/log
          chmod -R 777 webcalendar-api/var

      # config/jwt/*.pem are gitignored, so a fresh checkout has none and every
      # login 500s with "error occurred while trying to encode the JWT token".
      # The passphrase must match docker-compose's JWT_PASSPHRASE default.
      - name: Generate JWT keys
        working-directory: webcalendar-api
        run: |
          mkdir -p config/jwt
          openssl genrsa -out config/jwt/private.pem \
            -passout pass:wctng_jwt_dev_passphrase 4096
          openssl rsa -in config/jwt/private.pem \
            -passin pass:wctng_jwt_dev_passphrase \
            -pubout -out config/jwt/public.pem
          chmod 644 config/jwt/*.pem

      - name: Start Docker Compose stack
        run: |
          docker compose -f docker-compose.dev.yml up -d --build --wait
        timeout-minutes: 10

      # MySQL initialises from webcalendar-core's schema, which seeds no users,
      # but every spec signs in as admin/admin (tests/e2e/fixtures/auth.ts).
      # Same provisioning the API workflow does.
      - name: Apply migrations and seed admin fixture
        run: |
          docker compose -f docker-compose.dev.yml exec -T php-fpm \
            php bin/console migrations:migrate --no-interaction
          docker compose -f docker-compose.dev.yml exec -T php-fpm \
            php bin/console webcalendar:install --force --admin-password=admin

      - name: Install Playwright browsers
        working-directory: webcalendar-web
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Wait for services
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:47180/api/v2/health > /dev/null 2>&1; then
              echo "API is ready"
              break
            fi
            echo "Waiting for API... ($i)"
            sleep 2
          done

      - name: Run Playwright tests
        working-directory: webcalendar-web
        run: npx playwright test
        env:
          CI: true

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: webcalendar-web/playwright-report/
          retention-days: 7

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: webcalendar-web/test-results/
          retention-days: 7

      - name: Stop Docker Compose
        if: always()
        run: docker compose -f docker-compose.dev.yml down
