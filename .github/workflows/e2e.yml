name: E2E Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  e2e:
    name: Playwright E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: intl, pdo_mysql, zip, mbstring
          tools: composer:v2

      - name: Start Docker Compose stack
        run: |
          docker compose -f docker-compose.dev.yml up -d --build --wait
        timeout-minutes: 10

      - name: Install Playwright browsers
        working-directory: webcalendar-web
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Wait for services
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:47180/api/v2/health > /dev/null 2>&1; then
              echo "API is ready"
              break
            fi
            echo "Waiting for API... ($i)"
            sleep 2
          done

      - name: Run Playwright tests
        working-directory: webcalendar-web
        run: npx playwright test
        env:
          CI: true

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: webcalendar-web/playwright-report/
          retention-days: 7

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: webcalendar-web/test-results/
          retention-days: 7

      - name: Stop Docker Compose
        if: always()
        run: docker compose -f docker-compose.dev.yml down
