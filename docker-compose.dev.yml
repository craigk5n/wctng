services:
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "${PORT_NGINX:-47180}:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./webcalendar-api/public:/var/www/html/webcalendar-api/public:ro
    depends_on:
      php-fpm:
        condition: service_started
      vite-dev:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:80/api/v2/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  php-fpm:
    build:
      context: ./docker/php-fpm
      dockerfile: Dockerfile
    volumes:
      - ./webcalendar-api:/var/www/html/webcalendar-api
      - ../webcalendar-core:/var/www/html/webcalendar-core:ro
    environment:
      APP_ENV: ${APP_ENV:-dev}
      APP_SECRET: ${APP_SECRET:-dev_secret_not_for_production}
      DATABASE_URL: "mysql://${MYSQL_USER:-webcalendar}:${MYSQL_PASSWORD:-webcalendar_dev}@mysql:3306/${MYSQL_DATABASE:-webcalendar}"
      CORS_ALLOW_ORIGIN: ${CORS_ALLOW_ORIGIN:-http://localhost:47173}
      JWT_PASSPHRASE: ${JWT_PASSPHRASE:-wctng_jwt_dev_passphrase}
      JWT_TTL: ${JWT_TTL:-3600}
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "php-fpm -t 2>/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    restart: unless-stopped

  mysql:
    image: mysql:8.0
    ports:
      - "${PORT_MYSQL:-47106}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ../webcalendar-core/src/Infrastructure/Persistence/mysql-schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/02-init.sql:ro
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-wctng_root_secret}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-webcalendar}
      MYSQL_USER: ${MYSQL_USER:-webcalendar}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-webcalendar_dev}
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "--password=${MYSQL_ROOT_PASSWORD:-wctng_root_secret}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  vite-dev:
    image: node:20-alpine
    working_dir: /app
    ports:
      - "${PORT_VITE:-47173}:5173"
    volumes:
      - ./webcalendar-web:/app
    command: sh -c "npm install && npm run dev"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5173"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

volumes:
  mysql_data:
    name: wctng_mysql_data
