services:
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "${PORT_NGINX:-47180}:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./webcalendar-api/public:/var/www/html/webcalendar-api/public:ro
    depends_on:
      php-fpm:
        condition: service_started
      vite-dev:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:80/api/v2/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  php-fpm:
    build:
      context: ./docker/php-fpm
      dockerfile: Dockerfile
    volumes:
      - ./webcalendar-api:/var/www/html/webcalendar-api
    environment:
      APP_ENV: ${APP_ENV:-dev}
      APP_SECRET: ${APP_SECRET:-dev_secret_not_for_production}
      DATABASE_URL: "mysql://${MYSQL_USER:-webcalendar}:${MYSQL_PASSWORD:-webcalendar_dev}@mysql:3306/${MYSQL_DATABASE:-webcalendar}"
      CORS_ALLOW_ORIGIN: ${CORS_ALLOW_ORIGIN:-http://localhost:47173}
      JWT_PASSPHRASE: ${JWT_PASSPHRASE:-wctng_jwt_dev_passphrase}
      JWT_TTL: ${JWT_TTL:-3600}
      MERCURE_URL: http://mercure/.well-known/mercure
      MERCURE_PUBLIC_URL: http://localhost:${PORT_MERCURE:-47181}/.well-known/mercure
      MERCURE_JWT_SECRET: "${MERCURE_JWT_SECRET:-wctng_mercure_dev_secret_key_32ch}"
      APP_MODE: ${APP_MODE:-standalone}
      TENANT_BASE_DOMAIN: ${TENANT_BASE_DOMAIN:-webcalendar.local}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "php-fpm -t 2>/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    restart: unless-stopped

  mysql:
    image: mysql:8.0
    ports:
      - "${PORT_MYSQL:-47106}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./webcalendar-api/vendor/craigk5n/webcalendar-core/src/Infrastructure/Persistence/mysql-schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/02-init.sql:ro
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-wctng_root_secret}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-webcalendar}
      MYSQL_USER: ${MYSQL_USER:-webcalendar}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-webcalendar_dev}
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "--password=${MYSQL_ROOT_PASSWORD:-wctng_root_secret}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  mercure:
    image: dunglas/mercure:v0.16
    ports:
      - "${PORT_MERCURE:-47181}:80"
    environment:
      MERCURE_PUBLISHER_JWT_KEY: "${MERCURE_JWT_SECRET:-wctng_mercure_dev_secret_key_32ch}"
      MERCURE_SUBSCRIBER_JWT_KEY: "${MERCURE_JWT_SECRET:-wctng_mercure_dev_secret_key_32ch}"
      SERVER_NAME: ":80"
      MERCURE_EXTRA_DIRECTIVES: |
        cors_origins http://localhost:47173 http://localhost:47180
        anonymous
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 -O /dev/null 'http://localhost:80/.well-known/mercure?topic=/healthz' 2>&1 || true"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "${PORT_REDIS:-47179}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  vite-dev:
    image: node:20-alpine
    working_dir: /app
    ports:
      - "${PORT_VITE:-47173}:5173"
    volumes:
      - ./webcalendar-web:/app
    command: sh -c "npm install && npm run dev"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5173"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

volumes:
  mysql_data:
    name: wctng_mysql_data
